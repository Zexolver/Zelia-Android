name: Release APK

# Builds a release APK and attaches it to a GitHub Release whenever a tag
# like "v1.2.3" is pushed -- Obtainium tracks this repo's Releases page and
# picks up the APK asset automatically, no Play Store/app-store submission
# needed. Debug-signed (see build.gradle.kts) -- fine for personal
# sideloading; revisit with a real signing key if this is ever distributed
# more broadly.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"   # pinned to match the version this app was built/tested against locally

      - run: flutter pub get
      - run: flutter build apk --release

      - name: Rename APK with version
        run: |
          mkdir -p release
          cp build/app/outputs/flutter-apk/app-release.apk "release/zelia-${GITHUB_REF_NAME}.apk"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.apk
          generate_release_notes: true
